<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
#logo{width:480px;height:480px;border-radius:96px;background:linear-gradient(135deg,#1d4ed8 0%,#3b82f6 55%,#60a5fa 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
#logo:after{content:"";position:absolute;inset:-40%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent 70%);transform:translate(-25%,-35%)}
.card{width:300px;height:200px;border-radius:28px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35);position:relative;z-index:1;padding:28px 30px;box-sizing:border-box;color:#0b1220}
.card .t{font-size:22px;font-weight:700;letter-spacing:-.01em;color:#334}
.card .a{font-size:58px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
.card .a small{font-size:24px;color:#3b82f6;font-weight:800;margin-left:8px}
.check{position:absolute;right:-18px;bottom:-18px;width:84px;height:84px;border-radius:50%;background:#22c55e;border:8px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:900}
</style></head><body><div id="logo"><div class="card"><div class="t">Invoice · Arc</div><div class="a">25<small>USDC</small></div><div class="check">✓</div></div></div></body></html>
